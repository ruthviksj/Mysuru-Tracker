<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">

    <link rel="stylesheet" href="/styles.css">

  <body>
    <div class="garland" aria-hidden="true"></div>
    <header class="site-header">
      <a class="brand" href="/" data-route>
        <span class="brand-mark" aria-hidden="true">ॐ</span>
        <span><strong>GaneshaTracker</strong><small data-i18n="brand_tag">MYSURU, TOGETHER.</small></span>
      </a>
      <nav aria-label="Main navigation">
        <a href="/" data-route data-nav="home" data-i18n="nav_explore">Explore Ganeshas</a>
        <a href="/leaderboard/" data-route data-nav="leaderboard" data-i18n="nav_favourites">Community favourites</a>
        <button type="button" class="nav-btn" id="visarjanBtn" data-i18n="nav_visarjan">Visarjan</button>
      </nav>
      <div class="season" data-i18n="season">Mysuru · 2026</div>
      <button class="lang-toggle" id="langToggle" type="button">ಕನ್ನಡ</button>
      <a class="add-link" href="/add/" data-route data-i18n="nav_add">+ Add a Ganesha</a>

    <main id="app"></main>

    <footer>
      <span data-i18n="foot_made">Made with ♡ for Mysuru.</span>
      <strong data-i18n="foot_chant">Ganapati Bappa Morya!</strong>
      <button type="button" class="modak" id="coffeeBtn" data-i18n="foot_coffee">☕ Buy me a filter coffee</button>
      <span class="foot-legal"><a href="/privacy/" data-i18n="foot_privacy">Privacy</a> · <a href="/terms/" data-i18n="foot_terms">Terms</a></span>
    </footer>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
